# Reusable image build. Replaces the near-identical per-deployment
# build-{root,asap,openadmet}-docker.yml workflows: the deployment name is now
# an input rather than a copy of the file.
#
# Called by pr-deploy.yml (tag `pr-<n>`) and release-deploy.yml (CalVer tag),
# and dispatchable by hand for ad-hoc builds.

name: build images

on:
  workflow_call:
    inputs:
      deployment:
        description: 'Deployment to build images for (omsf, openadmet)'
        required: true
        type: string
      tag:
        description: 'Tag to publish in addition to the metadata-action defaults'
        required: true
        type: string
      compute-images:
        description: 'Also build the compute and fah-compute images'
        required: false
        default: true
        type: boolean
    outputs:
      server-digest:
        description: 'Digest of the server image, which is what actually gets deployed'
        value: ${{ jobs.server.outputs.digest }}

  workflow_dispatch:
    inputs:
      deployment:
        description: 'Deployment to build images for'
        required: true
        type: choice
        # asap and root are not deployed by this repo's automation, but both
        # instances are still running elsewhere — keep them buildable by hand.
        # Building an image deploys nothing: root stays frozen, and reaching it
        # still means going to its host deliberately.
        options: [omsf, openadmet, asap, root]
      tag:
        description: 'Tag to publish'
        required: true
        type: string
      compute-images:
        description: 'Also build the compute and fah-compute images'
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  NAMESPACE: OpenFreeEnergy

jobs:
  server:
    name: server image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/alchemiscale.org-${{ inputs.deployment }}-server
          tags: |
            type=raw,value=${{ inputs.tag }},priority=1000
            type=ref,event=branch,enable=true,priority=600
            type=ref,event=tag,enable=true,priority=600
            type=ref,event=pr,prefix=pr-,enable=true,priority=600
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/${{ inputs.deployment }}/docker/alchemiscale-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # conda-env solves dominate build time; unchanged conda-envs/ layers
          # are cache hits even when a rebuild is triggered by something else
          cache-from: type=gha,scope=${{ inputs.deployment }}-server
          cache-to: type=gha,mode=max,scope=${{ inputs.deployment }}-server

  compute:
    name: ${{ matrix.role }} image
    if: ${{ inputs.compute-images }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - role: compute
            dockerfile: alchemiscale-compute
          - role: fah-compute
            dockerfile: alchemiscale-fah-compute

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/alchemiscale.org-${{ inputs.deployment }}-${{ matrix.role }}
          tags: |
            type=raw,value=${{ inputs.tag }},priority=1000
            type=ref,event=branch,enable=true,priority=600
            type=ref,event=tag,enable=true,priority=600
            type=ref,event=pr,prefix=pr-,enable=true,priority=600
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/${{ inputs.deployment }}/docker/${{ matrix.dockerfile }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.deployment }}-${{ matrix.role }}
          cache-to: type=gha,mode=max,scope=${{ inputs.deployment }}-${{ matrix.role }}
