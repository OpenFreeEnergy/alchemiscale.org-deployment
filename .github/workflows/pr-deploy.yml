# Pull request environments.
#
# Static checks run on every PR that touches the chart, values, or workflows.
# Building images and deploying is opt-in per PR through the `test-deploy`
# label, so pushes to unlabelled PRs cost nothing: adding the label deploys the
# current head, removing it (or closing the PR) tears the environment down.

name: PR - deploy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'deployments/**'
      - 'charts/**'
      - 'infra/**'
      - '.github/workflows/**'

# A rapid push series should only ever deploy the newest head. A cancelled run
# can strand a release in `pending-upgrade`, which the deploy job recovers from
# before it starts.
concurrency:
  group: pr-deploy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TEST_CLUSTER: ${{ vars.TEST_CLUSTER || 'alchemiscale-test' }}
  REGISTRY: ghcr.io
  NAMESPACE: openfreeenergy

jobs:
  # -------------------------------------------------------------------------
  # cheap checks, on every PR — chart regressions surface here long before a
  # live deploy
  # -------------------------------------------------------------------------
  static-checks:
    name: chart and infrastructure checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: helm lint
        run: |
          set -euo pipefail
          for values in deployments/*/values.yaml; do
            deployment="$(basename "$(dirname "$values")")"
            echo "::group::lint $deployment"
            helm lint charts/alchemiscale -f "$values" --set image.tag=lint
            helm lint charts/alchemiscale -f "$values" \
              -f "deployments/$deployment/values-pr.yaml" --set image.tag=lint
            echo "::endgroup::"
          done

      - name: golden-diff rendered manifests
        run: |
          scripts/render-golden.sh
          if ! git diff --exit-code -- charts/alchemiscale/tests/__snapshots__; then
            echo "::error::Rendered manifests differ from the committed snapshots. Run scripts/render-golden.sh and commit the result."
            exit 1
          fi

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.6
          tofu_wrapper: false

      # Five working directories each want their own copy of the providers, and
      # the AWS provider binary alone is ~840 MB — without a shared cache this
      # step downloads over 4 GB per run. The cache makes it one download, reused
      # across directories and across runs.
      - name: Cache OpenTofu providers
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tofu-plugins
          key: tofu-plugins-${{ runner.os }}-${{ hashFiles('infra/opentofu/**/versions.tf') }}
          restore-keys: |
            tofu-plugins-${{ runner.os }}-

      - name: tofu fmt and validate
        env:
          # absolute path: OpenTofu does not expand `~` in this variable
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tofu-plugins
        run: |
          set -euo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          tofu fmt -check -recursive infra/opentofu
          for dir in infra/opentofu/modules/cluster infra/opentofu/identity infra/opentofu/prod infra/opentofu/test infra/opentofu/bootstrap; do
            echo "::group::validate $dir"
            tofu -chdir="$dir" init -backend=false -input=false
            tofu -chdir="$dir" validate
            echo "::endgroup::"
          done

  # -------------------------------------------------------------------------
  # what, if anything, to deploy
  # -------------------------------------------------------------------------
  changes:
    name: detect modified deployments
    runs-on: ubuntu-latest
    # Fork PRs never reach the deploy path: no OIDC role is ever exposed to
    # code from outside the repository, and `pull_request_target` is
    # deliberately not used.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'test-deploy')

    outputs:
      deployments: ${{ steps.detect.outputs.deployments }}
      rebuild: ${{ steps.detect.outputs.rebuild }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect
        id: detect
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "changed files:"; echo "$changed"

          # A deployment is deployable only if it has chart values. The frozen
          # legacy `root` instance deliberately has none — it runs its own
          # docker-compose stack on EC2 until it is retired — so it is invisible
          # to this workflow by construction rather than by a name check.
          deployable="$(find deployments -mindepth 2 -maxdepth 2 -name values.yaml \
            -printf '%h\n' | xargs -r -n1 basename | sort)"
          echo "deployable instances:"; echo "$deployable"

          if echo "$changed" | grep -qE '^charts/'; then
            # a chart change affects every instance
            deployments="$deployable"
          else
            touched="$(echo "$changed" | grep -E '^deployments/' | cut -d/ -f2 | sort -u || true)"
            deployments="$(comm -12 <(echo "$touched") <(echo "$deployable"))"
          fi

          # Only the image inputs justify a rebuild; a chart- or values-only
          # push redeploys the pr-<n> images that are already in the registry.
          if echo "$changed" | grep -qE '^deployments/[^/]+/(conda-envs|docker)/'; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          fi

          # sed, not grep, so that an empty result is not a pipeline failure
          json="$(printf '%s\n' "$deployments" | sed '/^$/d' | jq -R . | jq -sc .)"
          echo "deployments=$json" >> "$GITHUB_OUTPUT"
          echo "will deploy: $json"

  # -------------------------------------------------------------------------
  # the cluster may well be spun down; bring it up (no-op if it is not)
  # -------------------------------------------------------------------------
  cluster:
    name: ensure the test cluster exists
    needs: changes
    if: needs.changes.outputs.deployments != '[]'
    uses: ./.github/workflows/test-cluster-lifecycle.yml
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      actions: read
    with:
      action: up
      pr-number: ${{ github.event.pull_request.number }}

  build:
    name: build ${{ matrix.deployment }} images
    needs: changes
    if: needs.changes.outputs.rebuild == 'true' && needs.changes.outputs.deployments != '[]'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        deployment: ${{ fromJSON(needs.changes.outputs.deployments) }}
    uses: ./.github/workflows/build-images.yml
    with:
      deployment: ${{ matrix.deployment }}
      tag: pr-${{ github.event.pull_request.number }}
      # PR environments only run the server image; compute images are built at
      # release time
      compute-images: false

  # -------------------------------------------------------------------------
  # deploy and smoke test
  # -------------------------------------------------------------------------
  deploy:
    name: deploy ${{ matrix.deployment }}
    needs: [changes, cluster, build]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.cluster.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        deployment: ${{ fromJSON(needs.changes.outputs.deployments) }}

    env:
      PR: ${{ github.event.pull_request.number }}
      DEPLOYMENT: ${{ matrix.deployment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Deploy by digest, never by tag: tags are mutable, and a force-push
      # reuses `pr-<n>`. Resolving here also covers the case where this run
      # skipped the build because nothing image-related changed.
      - name: Resolve image digest
        id: image
        run: |
          set -euo pipefail
          image="${REGISTRY}/${NAMESPACE}/alchemiscale.org-${DEPLOYMENT}-server"
          digest="$(docker buildx imagetools inspect "${image}:pr-${PR}" --format '{{.Manifest.Digest}}')"
          echo "repository=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "deploying ${image}@${digest}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_PR_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name "$TEST_CLUSTER" --region "$AWS_REGION"

      - name: Create the namespace and its AWS identity
        env:
          SCRATCH_ROLE: ${{ vars.TEST_SCRATCH_ROLE_ARN }}
        run: |
          set -euo pipefail
          ns="${DEPLOYMENT}-pr-${PR}"

          kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -

          # PR namespaces are created on demand, so their Pod Identity
          # association cannot be declared in OpenTofu the way production's is
          existing="$(aws eks list-pod-identity-associations \
            --cluster-name "$TEST_CLUSTER" --namespace "$ns" \
            --query "length(associations[?serviceAccount=='alchemiscale'])" --output text)"

          if [ "$existing" = "0" ]; then
            aws eks create-pod-identity-association \
              --cluster-name "$TEST_CLUSTER" \
              --namespace "$ns" \
              --service-account alchemiscale \
              --role-arn "$SCRATCH_ROLE"
          fi

      # A run cancelled mid-upgrade (see the concurrency group above) can leave
      # the release in pending-upgrade, which blocks every later deploy.
      - name: Recover a stranded release
        run: |
          set -euo pipefail
          ns="${DEPLOYMENT}-pr-${PR}"
          status="$(helm status "$ns" -n "$ns" -o json 2>/dev/null | jq -r '.info.status' || echo none)"
          echo "current release status: $status"

          case "$status" in
            pending-install)
              helm uninstall "$ns" -n "$ns" --wait --timeout 5m || true
              ;;
            pending-upgrade|pending-rollback)
              helm rollback "$ns" -n "$ns" --wait --timeout 5m \
                || helm uninstall "$ns" -n "$ns" --wait --timeout 5m || true
              ;;
          esac

      - name: Deploy
        run: |
          set -euo pipefail
          ns="${DEPLOYMENT}-pr-${PR}"

          helm upgrade --install "$ns" charts/alchemiscale \
            --namespace "$ns" \
            --values "deployments/${DEPLOYMENT}/values.yaml" \
            --values "deployments/${DEPLOYMENT}/values-pr.yaml" \
            --set clusterName="$TEST_CLUSTER" \
            --set image.repository="${{ steps.image.outputs.repository }}" \
            --set image.tag="pr-${PR}" \
            --set image.digest="${{ steps.image.outputs.digest }}" \
            --set s3.bucket="${{ vars.TEST_SCRATCH_BUCKET }}" \
            --set s3.prefix="pr-${PR}/${DEPLOYMENT}" \
            --atomic --wait --timeout 15m

      - name: Smoke test
        run: |
          ns="${DEPLOYMENT}-pr-${PR}"
          helm test "$ns" -n "$ns" --logs --timeout 10m

      - name: Collect diagnostics
        if: failure()
        run: |
          ns="${DEPLOYMENT}-pr-${PR}"
          echo "::group::events"
          kubectl get events -n "$ns" --sort-by=.lastTimestamp || true
          echo "::endgroup::"
          echo "::group::pods"
          kubectl get pods -n "$ns" -o wide || true
          kubectl describe pods -n "$ns" || true
          echo "::endgroup::"
          echo "::group::logs"
          for pod in $(kubectl get pods -n "$ns" -o name); do
            echo "--- $pod"
            kubectl logs -n "$ns" "$pod" --all-containers --tail=200 || true
          done
          echo "::endgroup::"

      - name: Report on the pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          ns="${DEPLOYMENT}-pr-${PR}"
          marker="<!-- alchemiscale-pr-env:${DEPLOYMENT} -->"

          body=$(cat <<EOF
          $marker
          **\`${DEPLOYMENT}\` test environment: ${RESULT}**

          | | |
          | --- | --- |
          | namespace | \`${ns}\` (cluster \`${TEST_CLUSTER}\`) |
          | image | \`${{ steps.image.outputs.digest }}\` |

          There is no public endpoint — reach it through the Kubernetes API:

          \`\`\`bash
          aws eks update-kubeconfig --name ${TEST_CLUSTER}
          kubectl -n ${ns} port-forward svc/alchemiscale-client-api 1840:1840
          \`\`\`

          Remove the \`test-deploy\` label to tear this down.
          EOF
          )

          # sticky comment: update in place rather than adding one per push
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/${PR}/comments" \
            --jq "[.[] | select(.body | contains(\"$marker\"))] | .[0].id // empty")

          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/${PR}/comments" -f body="$body" >/dev/null
          fi
