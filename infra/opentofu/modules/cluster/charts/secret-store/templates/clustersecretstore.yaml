apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.name }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "region is required" .Values.region | quote }}
      # no auth block: the controller's ServiceAccount carries an EKS Pod
      # Identity association, so the default credential chain resolves to the
      # scoped Secrets Manager role
