{{- if .Values.secrets.external.enabled }}
{{- $deployment := required "deployment must be set when secrets.external.enabled" .Values.deployment }}
{{- $neo4jSecret := .Values.secrets.external.neo4jSecretName | default (printf "alchemiscale/%s/neo4j" $deployment) }}
{{- $jwtSecret := .Values.secrets.external.jwtSecretName | default (printf "alchemiscale/%s/jwt" $deployment) }}
{{/*
Secrets Manager -> a Kubernetes Secret in this namespace. The values are set
out-of-band by an operator; nothing here, in the repo, or in a workflow ever
sees them.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "alchemiscale.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "alchemiscale.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.external.refreshInterval }}

  secretStoreRef:
    name: {{ .Values.secrets.external.storeName }}
    kind: {{ .Values.secrets.external.storeKind }}

  target:
    name: {{ include "alchemiscale.secretName" . }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        NEO4J_USER: {{ `"{{ .NEO4J_USER }}"` }}
        NEO4J_PASS: {{ `"{{ .NEO4J_PASS }}"` }}
        # the neo4j image takes credentials as a single user/password string
        NEO4J_AUTH: {{ `"{{ .NEO4J_USER }}/{{ .NEO4J_PASS }}"` }}
        JWT_SECRET_KEY: {{ `"{{ .JWT_SECRET_KEY }}"` }}

  dataFrom:
    - extract:
        key: {{ $neo4jSecret | quote }}
    - extract:
        key: {{ $jwtSecret | quote }}
{{- end }}
