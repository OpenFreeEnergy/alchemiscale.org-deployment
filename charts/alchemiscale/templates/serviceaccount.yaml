{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "alchemiscale.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "alchemiscale.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# An EKS Pod Identity association (declared in OpenTofu for production, created
# by the PR workflow for test namespaces) binds this ServiceAccount to the AWS
# role that grants S3 access — which is what removes static AWS keys from the
# server config path entirely.
{{- end }}
