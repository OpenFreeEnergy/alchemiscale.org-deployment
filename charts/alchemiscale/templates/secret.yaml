{{- if .Values.secrets.generate.enabled }}
{{/*
Throwaway credentials for PR environments. Generated once and then reused:
`lookup` returns the existing Secret on an upgrade, so redeploying a PR
environment does not change the password out from under the database that was
initialised with it.

`lookup` returns nothing during `helm template` and `--dry-run`, which is why
the golden snapshots show freshly generated values — that is expected, and the
values are never used for anything real.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "alchemiscale.secretName" .) }}
{{- $data := (and $existing $existing.data) | default dict }}
{{- $neo4jUser := "neo4j" }}
{{/* explicit values exist so that golden-diff renders are deterministic */}}
{{- $neo4jPass := .Values.secrets.generate.neo4jPassword | default (get $data "NEO4J_PASS" | b64dec) | default (randAlphaNum 32) | b64enc }}
{{- $jwtKey := .Values.secrets.generate.jwtSecretKey | default (get $data "JWT_SECRET_KEY" | b64dec) | default (randAlphaNum 64) | b64enc }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alchemiscale.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "alchemiscale.labels" . | nindent 4 }}
type: Opaque
data:
  NEO4J_USER: {{ $neo4jUser | b64enc | quote }}
  NEO4J_PASS: {{ $neo4jPass | quote }}
  NEO4J_AUTH: {{ printf "%s/%s" $neo4jUser ($neo4jPass | b64dec) | b64enc | quote }}
  JWT_SECRET_KEY: {{ $jwtKey | quote }}
{{- end }}
