apiVersion: v1
kind: Service
metadata:
  name: {{ include "alchemiscale.neo4jServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "alchemiscale.labels" . | nindent 4 }}
    app.kubernetes.io/component: neo4j
spec:
  # never exposed outside the namespace: identity administration and dumps run
  # inside the cluster, which is why the admin path is `kubectl exec`
  type: ClusterIP
  selector:
    {{- include "alchemiscale.selectorLabels" (dict "ctx" . "component" "neo4j") | nindent 4 }}
  ports:
    - name: bolt
      port: 7687
      targetPort: bolt
    - name: http
      port: 7474
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "alchemiscale.neo4jServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "alchemiscale.labels" . | nindent 4 }}
    app.kubernetes.io/component: neo4j
spec:
  serviceName: {{ include "alchemiscale.neo4jServiceName" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "alchemiscale.selectorLabels" (dict "ctx" . "component" "neo4j") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "alchemiscale.labels" . | nindent 8 }}
        app.kubernetes.io/component: neo4j
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Auto Mode consolidation must never casually evict a database; with only
        # a couple of prod nodes, this guard is what keeps repacking safe
        karpenter.sh/do-not-disrupt: "true"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "alchemiscale.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        # the official neo4j image runs as uid/gid 7474
        fsGroup: 7474
      containers:
        - name: neo4j
          image: {{ include "alchemiscale.neo4j.image" . }}
          imagePullPolicy: {{ .Values.neo4j.image.pullPolicy }}
          ports:
            - name: bolt
              containerPort: 7687
            - name: http
              containerPort: 7474
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "alchemiscale.secretName" . }}
                  key: NEO4J_AUTH
            {{- /* neo4j.conf keys become NEO4J_* env vars: `.` -> `_`, `_` -> `__` */}}
            {{- range $key, $value := .Values.neo4j.config }}
            - name: {{ printf "NEO4J_%s" ($key | replace "_" "__" | replace "." "_") }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: bolt
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            {{- toYaml .Values.neo4j.resources | nindent 12 }}
        {{- if .Values.neo4j.diskMetrics.enabled }}
        - name: disk-metrics
          # same image as the APIs: it already carries python and boto3, and its
          # ServiceAccount already has the one CloudWatch permission needed
          image: {{ include "alchemiscale.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/local/bin/_entrypoint.sh
            - python
            - -u
            - -c
            - |
              import os, time, boto3

              interval = int(os.environ["INTERVAL_SECONDS"])
              client = boto3.client("cloudwatch")
              dimensions = [
                  {"Name": "ClusterName", "Value": os.environ["CLUSTER_NAME"]},
                  {"Name": "Namespace", "Value": os.environ["POD_NAMESPACE"]},
              ]

              while True:
                  stat = os.statvfs("/data")
                  total = stat.f_blocks * stat.f_frsize
                  used = total - stat.f_bavail * stat.f_frsize
                  percent = 100.0 * used / total if total else 0.0

                  client.put_metric_data(
                      Namespace=os.environ["METRIC_NAMESPACE"],
                      MetricData=[
                          {
                              "MetricName": "neo4j_data_used_percent",
                              "Dimensions": dimensions,
                              "Value": percent,
                              "Unit": "Percent",
                          },
                          {
                              "MetricName": "neo4j_data_used_bytes",
                              "Dimensions": dimensions,
                              "Value": float(used),
                              "Unit": "Bytes",
                          },
                      ],
                  )
                  time.sleep(interval)
          env:
            - name: INTERVAL_SECONDS
              value: {{ .Values.neo4j.diskMetrics.intervalSeconds | quote }}
            - name: METRIC_NAMESPACE
              value: {{ .Values.neo4j.diskMetrics.namespace | quote }}
            - name: CLUSTER_NAME
              value: {{ .Values.clusterName | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.s3.region | quote }}
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "alchemiscale.labels" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.neo4j.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.neo4j.storage }}
