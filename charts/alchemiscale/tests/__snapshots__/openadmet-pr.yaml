apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alchemiscale-neo4j
  namespace: openadmet-pr-0
  labels:
    helm.sh/chart: alchemiscale-0.1.0
    app.kubernetes.io/name: alchemiscale
    app.kubernetes.io/instance: openadmet-pr-0
    app.kubernetes.io/version: "0.7.2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: alchemiscale
    alchemiscale.org/deployment: openadmet
    app.kubernetes.io/component: neo4j
spec:
  serviceName: alchemiscale-neo4j
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alchemiscale
      app.kubernetes.io/instance: openadmet-pr-0
      app.kubernetes.io/component: neo4j
  template:
    metadata:
      labels:
        helm.sh/chart: alchemiscale-0.1.0
        app.kubernetes.io/name: alchemiscale
        app.kubernetes.io/instance: openadmet-pr-0
        app.kubernetes.io/version: "0.7.2"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: alchemiscale
        alchemiscale.org/deployment: openadmet
        app.kubernetes.io/component: neo4j
      annotations:
        # Auto Mode consolidation must never casually evict a database; with only
        # a couple of prod nodes, this guard is what keeps repacking safe
        karpenter.sh/do-not-disrupt: "true"
    spec:
      serviceAccountName: alchemiscale
      securityContext:
        # the official neo4j image runs as uid/gid 7474
        fsGroup: 7474
      containers:
        - name: neo4j
          image: neo4j:5.25
          imagePullPolicy: IfNotPresent
          ports:
            - name: bolt
              containerPort: 7687
            - name: http
              containerPort: 7474
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: alchemiscale-secrets
                  key: NEO4J_AUTH
            - name: NEO4J_server_memory_heap_initial__size
              value: "512m"
            - name: NEO4J_server_memory_heap_max__size
              value: "1G"
            - name: NEO4J_server_memory_pagecache_size
              value: "512m"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: bolt
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            limits:
              memory: 3Gi
            requests:
              cpu: 200m
              memory: 1500Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          helm.sh/chart: alchemiscale-0.1.0
          app.kubernetes.io/name: alchemiscale
          app.kubernetes.io/instance: openadmet-pr-0
          app.kubernetes.io/version: "0.7.2"
          app.kubernetes.io/managed-by: Helm
          app.kubernetes.io/part-of: alchemiscale
          alchemiscale.org/deployment: openadmet
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
