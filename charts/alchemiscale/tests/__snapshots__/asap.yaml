apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alchemiscale
  namespace: asap
  labels:
    helm.sh/chart: alchemiscale-0.1.0
    app.kubernetes.io/name: alchemiscale
    app.kubernetes.io/instance: asap
    app.kubernetes.io/version: "0.7.2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: alchemiscale
    alchemiscale.org/deployment: asap
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /ping
    alb.ingress.kubernetes.io/group.name: alchemiscale
spec:
  ingressClassName: alb
  rules:
    - host: "api.asap.alchemiscale.org"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alchemiscale-client-api
                port:
                  number: 1840
    - host: "compute.asap.alchemiscale.org"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alchemiscale-compute-api
                port:
                  number: 1841
