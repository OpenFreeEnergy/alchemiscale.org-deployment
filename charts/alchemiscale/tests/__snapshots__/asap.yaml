    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: alchemiscale
    alchemiscale.org/deployment: asap
    app.kubernetes.io/component: smoke-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  smoke_test.py: |
    """End-to-end check of a freshly deployed alchemiscale instance."""

    import os
    import secrets
    import subprocess
    import sys
    import urllib.request

    CLIENT_API = os.environ["CLIENT_API_URL"]
    COMPUTE_API = os.environ["COMPUTE_API_URL"]
    READ_ONLY = os.environ.get("READ_ONLY", "false").lower() == "true"


    def check(message):
        print(f"[smoke-test] {message}", flush=True)


    def ping(url):
        check(f"ping {url}")
        with urllib.request.urlopen(f"{url}/ping", timeout=30) as response:
            if response.status != 200:
                raise SystemExit(f"{url}/ping returned {response.status}")


    ping(CLIENT_API)
    ping(COMPUTE_API)

    if READ_ONLY:
        check("read-only mode: skipping identity registration and round trip")
        sys.exit(0)

    identity = os.environ["SMOKE_IDENTITY"]
    scope = os.environ["SMOKE_SCOPE"]
    key = secrets.token_hex(32)

    # identity administration talks to neo4j over bolt, never through the API —
    # the same reason operators run it with `kubectl exec` rather than remotely
    check(f"registering throwaway identity {identity}")
    subprocess.run(
        ["alchemiscale", "identity", "add", "-t", "user", "-i", identity, "-k", key],
        check=True,
    )
    subprocess.run(
        ["alchemiscale", "identity", "add-scope", "-t", "user", "-i", identity, "-s", scope],
        check=True,
    )

    check("authenticated client round trip")
    from alchemiscale import AlchemiscaleClient

    client = AlchemiscaleClient(CLIENT_API, identity, key)
    scopes = client.list_scopes()

    if not any(str(s) == scope for s in scopes):
        raise SystemExit(f"expected scope {scope} in {scopes}")

    check("all checks passed")
