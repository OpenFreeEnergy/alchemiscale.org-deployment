# Source: alchemiscale/templates/externalsecret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alchemiscale
  namespace: asap
  labels:
    helm.sh/chart: alchemiscale-0.1.0
    app.kubernetes.io/name: alchemiscale
    app.kubernetes.io/instance: asap
    app.kubernetes.io/version: "0.7.2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: alchemiscale
    alchemiscale.org/deployment: asap
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: alchemiscale-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        NEO4J_USER: "{{ .NEO4J_USER }}"
        NEO4J_PASS: "{{ .NEO4J_PASS }}"
        # the neo4j image takes credentials as a single user/password string
        NEO4J_AUTH: "{{ .NEO4J_USER }}/{{ .NEO4J_PASS }}"
        JWT_SECRET_KEY: "{{ .JWT_SECRET_KEY }}"

  dataFrom:
    - extract:
        key: "alchemiscale/asap/neo4j"
    - extract:
        key: "alchemiscale/asap/jwt"
