apiVersion: v2
name: alchemiscale
description: >-
  An alchemiscale server instance: neo4j, the client and compute APIs, the
  strategist, and the one-shot database initialisation. One chart, instantiated
  per named deployment for production and per pull request for test.
type: application

# chart version — bump on chart changes, independent of the alchemiscale release
version: 0.1.0

# Nominal alchemiscale version this chart targets. Documentation only: nothing
# renders it, because the version that actually runs comes from the image, whose
# conda pins are in deployments/<name>/conda-envs/. Left here because Helm wants
# the field, and deliberately not maintained in lockstep with those pins — see
# the version label in templates/_helpers.tpl.
appVersion: "0.8.0"

home: https://github.com/OpenFreeEnergy/alchemiscale.org-deployment
sources:
  - https://github.com/OpenFreeEnergy/alchemiscale
  - https://github.com/OpenFreeEnergy/alchemiscale.org-deployment
maintainers:
  - name: OpenFreeEnergy
