# The manager only touches its own Jobs in its own namespace: it lists them for
# health and consistency checks, creates new compute services, and deletes
# finished ones. It reads pods to log why failed Jobs failed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alchemiscale-compute-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alchemiscale-compute-manager
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alchemiscale-compute-manager
subjects:
  - kind: ServiceAccount
    name: alchemiscale-compute-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alchemiscale-compute-manager
