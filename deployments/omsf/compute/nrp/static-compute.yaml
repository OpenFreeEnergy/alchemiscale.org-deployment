# A fixed number of omsf compute services, without the manager. For manual
# testing, or as a fallback when the manager is unavailable. The manager ignores
# Jobs it didn't create, so this can run alongside it.
#
#   kubectl -n choderalab create -f deployments/omsf/compute/nrp/static-compute.yaml
#
# Each pod typically runs one Task (see `max_time` in the service settings):
# `parallelism` sets how many run at once, `completions` how many run in total.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: omsf-alchemiscale-compute-static-
  labels:
    app: alchemiscale-compute-static
    app.kubernetes.io/instance: omsf
    app.kubernetes.io/part-of: alchemiscale
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: alchemiscale-compute-static
        app.kubernetes.io/instance: omsf
        app.kubernetes.io/part-of: alchemiscale
    spec:
      restartPolicy: Never
      # NRP labels GPU nodes by model; uncomment to choose one
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #             - key: nvidia.com/gpu.product
      #               operator: In
      #               values: ["NVIDIA-A10"]
      containers:
        - name: compute
          # keep this tag in step with job-spec.yaml and kustomization.yaml
          image: ghcr.io/openfreeenergy/alchemiscale.org-omsf-compute:nrp-test-1
          args: ["compute", "synchronous", "-c", "/mnt/service-settings/service-settings.yaml"]
          resources:
            requests:
              cpu: 2
              memory: 12Gi
              ephemeral-storage: 48Gi
              nvidia.com/gpu: 1
            limits:
              cpu: 2
              memory: 12Gi
              ephemeral-storage: 48Gi
              nvidia.com/gpu: 1
          env:
            - name: OPENMM_CPU_THREADS
              value: "2"
          volumeMounts:
            - name: service-settings
              mountPath: /mnt/service-settings
              readOnly: true
      volumes:
        - name: service-settings
          secret:
            secretName: omsf-alchemiscale-compute-service-settings
