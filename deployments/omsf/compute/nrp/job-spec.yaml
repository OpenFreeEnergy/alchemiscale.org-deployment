# Job template for each compute service the manager creates. The manager sets
# the Job's name, its `app` and `k8s.alchemiscale.org/compute-manager` labels,
# one pod per Job with no retries, and appends `--name` and
# `--compute-manager-id` to the first container's args.
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/instance: omsf
    app.kubernetes.io/part-of: alchemiscale
spec:
  # keep longer than the manager's sleep_interval, so failed Jobs are logged
  # before Kubernetes removes them
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: omsf
        app.kubernetes.io/part-of: alchemiscale
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  # nodes with a faulty GPU that still takes pods, then rejects
                  # them with UnexpectedAdmissionError; remove once NRP fixes them
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - k8s-chase-ci-07.calit2.optiputer.net
                      - k8s-haosu-22.sdsc.optiputer.net
                      - nautilus-ext-gpu01.fullerton.edu
                      - k8s-haosu-15.sdsc.optiputer.net
                      - k8s-chase-ci-01.calit2.optiputer.net
                      - fiona8-1.calit2.uci.edu
                      - uicnrp-fiona.evl.uic.edu
                      - k8s-haosu-21.sdsc.optiputer.net
                  # NRP labels GPU nodes by model; uncomment to choose one
                  # - key: nvidia.com/gpu.product
                  #   operator: In
                  #   values: ["NVIDIA-A10"]
      containers:
        - name: compute
          # keep this tag in step with `images` in kustomization.yaml
          image: ghcr.io/openfreeenergy/alchemiscale.org-omsf-compute:2026.11.16-0
          args: ["compute", "synchronous", "-c", "/mnt/service-settings/service-settings.yaml"]
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
              ephemeral-storage: 48Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "1.2"
              memory: 4Gi
              ephemeral-storage: 48Gi
              nvidia.com/gpu: "1"
          env:
            - name: OPENMM_CPU_THREADS
              value: "1"
          volumeMounts:
            - name: service-settings
              mountPath: /mnt/service-settings
              readOnly: true
      volumes:
        - name: service-settings
          secret:
            secretName: omsf-alchemiscale-compute-service-settings
