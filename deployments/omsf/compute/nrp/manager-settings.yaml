# K8SManagerSettings for the omsf NRP compute manager.

# Becomes the ComputeManagerID and the prefix of every Job name
# (`<name>.<32-hex-uuid>`). Must be lowercase letters, digits and dots only:
# alchemiscale forbids `-`, Kubernetes forbids `_`, `:` and uppercase. Keep it to
# 30 characters or fewer so Job names fit the 63-character label limit.
name: nrp.omsf

# must match the namespace in kustomization.yaml
namespace: choderalab

# Job template the manager stamps out; mounted from the same ConfigMap
job_spec_path: /mnt/manager-config/job-spec.yaml

# ceiling on concurrent compute services (i.e. GPUs) this manager will hold
max_compute_services: 4

# most Jobs submitted per cycle
max_submit_per_cycle: 2

# stop if failed Jobs turn up in more than this many consecutive cycles that
# create compute services; usually a bad image, Job spec or settings
max_consecutive_failed_cycles: 5

# seconds between instructions from the compute API; also the fastest the
# manager can scale up
sleep_interval: 300

loglevel: INFO
logfile: null

k8s_max_retries: 5
k8s_retry_base_seconds: 2.0
k8s_retry_max_seconds: 60.0
