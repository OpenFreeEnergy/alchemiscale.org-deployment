# Production values for the `omsf` deployment.
#
# Workflows supply image.tag and image.digest; everything else that differs from
# the chart defaults lives here.

deployment: omsf
domain: omsf.alchemiscale.org
clusterName: alchemiscale-prod

image:
  repository: ghcr.io/openfreeenergy/alchemiscale.org-omsf-server

s3:
  bucket: alchemiscale-omsf
  prefix: object-store
  region: us-east-1

# Single replica until the JWT key bug upstream is fixed.
#
# `alchemiscale api`'s --jwt-secret click option has callback=generate_secret_key,
# and that callback discards the supplied value and returns a fresh random key on
# every invocation. So JWT_SECRET_KEY from the environment is read and thrown
# away, and each server process signs with a key only it knows. Behind a
# round-robin load balancer, a token minted by one replica is rejected by the
# other — about half of all authenticated requests fail with 401 "Could not
# validate credentials".
#
# Restore 2 (and the PodDisruptionBudget below) once the upstream fix ships. The
# cost of this workaround is availability: losing the node takes the API with it
# until the pod is rescheduled.
clientApi:
  replicas: 1
  workers: 4
  config:
    timeout: 2400

computeApi:
  # same reason as clientApi above
  replicas: 1
  workers: 8
  config:
    timeout: 600

# mirrors the strategist-config.yaml the root instance runs today
strategist:
  enabled: true
  config:
    sleep_interval: 300
    max_workers: 4
    scopes:
      - '*-*-*'
    cache_directory: null
    cache_size_limit: 1073741824
    use_local_cache: true

neo4j:
  # size from the current host's data directory at cutover, with headroom
  storage: 200Gi
  # memory and tuning come from the chart defaults: the existing instances do
  # not use more than this one does. Only the CPU floor is raised, and only
  # `cpu` is set — Helm deep-merges, so `memory` still comes from the chart.
  resources:
    requests:
      cpu: "1"

ingress:
  enabled: true
