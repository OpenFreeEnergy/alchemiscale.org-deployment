name: alchemiscale-compute-fah
channels:
  - conda-forge

dependencies:
  - pip
  - python =3.12
  - cuda-version =12.6

  - alchemiscale-compute =0.8.0
  
  # openmm protocols
  - feflow =0.2.1

  # additional pins
  - gufe =1.13.1
  - openfe =1.13.0
  - openmm =8.6.1
  - openmmforcefields =0.15.1
  - openff-toolkit =0.18.1
  - openff-interchange =0.5.3
  - pontibus =0.6.0

  ## pins due to breaking changes
  - libsqlite<3.49  # newer versions cause diskcache to fail

  # alchemiscale-fah dependencies
  - cryptography
  - plyvel
  - zstandard

  - pip:
    - git+https://github.com/OpenFreeEnergy/alchemiscale-fah.git@v0.3.1
