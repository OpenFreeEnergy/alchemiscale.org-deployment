name: alchemiscale-compute
channels:
  - conda-forge

dependencies:
  - pip
  - python =3.12
  - cuda-version =12.6

  - alchemiscale-compute =0.7.2
  
  # openmm protocols
  - feflow =0.2.1

  # additional pins
  - gufe =1.12.0
  - openfe =1.12.0
  - openmm =8.4.0
  - openmmforcefields =0.15.1
  - openff-toolkit =0.18.1
  - openff-interchange =0.5.3
  - pontibus =0.5.0

  ## pins due to breaking changes
  - libsqlite<3.49  # newer versions cause diskcache to fail

  # alchemiscale-k8s dependencies
  - python-kubernetes

  - pip:
    - "git+https://github.com/datryllic/alchemiscale-k8s.git@v0.1.0#subdirectory=pkg"
