name: alchemiscale-compute
channels:
  - conda-forge

dependencies:
  - pip
  - python =3.12
  - cuda-version =11.8

  - alchemiscale-compute =0.7.2
  
  # openmm protocols
  - feflow =0.2.1

  # additional pins
  - gufe =1.12.0
  - openfe =1.12.0
  - openmm =8.2.0
  - openmmforcefields =0.16.0
  - openff-toolkit =0.18.1

  ## pins due to breaking changes
  - libsqlite<3.49  # newer versions cause diskcache to fail
