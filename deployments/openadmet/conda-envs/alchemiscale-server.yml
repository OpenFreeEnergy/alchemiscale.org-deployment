name: alchemiscale-server
channels:
  - conda-forge

dependencies:
  - pip
  - python =3.12
  - cuda-version =11.8

  - alchemiscale-server =0.7.2

  # openmm protocols
  - feflow =0.2.1

  # additional pins
  - gufe =1.12.0
  - openfe =1.12.0
  - openmm =8.2.0
  - openmmforcefields =0.15.1
  - openff-toolkit =0.18.1

  ## pins due to breaking changes
  - libsqlite<3.49  # newer versions cause diskcache to fail

  # deployment
  - curl         # used in healthchecks for API services

  # alchemiscale-fah dependencies
  - cryptography
  - plyvel

  - pip:
    - git+https://github.com/OpenFreeEnergy/alchemiscale.git@fix/pint-quantity-node-properties
    - git+https://github.com/OpenFreeEnergy/gufe.git@perf/linear-bond-iteration
    - git+https://github.com/OpenFreeEnergy/alchemiscale-fah.git@v0.3.1
